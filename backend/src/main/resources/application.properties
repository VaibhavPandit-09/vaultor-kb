spring.application.name=vaultor

# SQLite Database setup
spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/app.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
# Inspect mapped tables individually: SQLite FTS5/shadow columns have empty JDBC type names.
# Grouped discovery parses those unrelated columns and crashes on subsequent startups.
spring.jpa.properties.hibernate.hbm2ddl.jdbc_metadata_extraction_strategy=individually
spring.jpa.show-sql=false

# File settings
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:512MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:512MB}
app.storage.path=${STORAGE_PATH:./data/files}

# Optional: logging and server properties
server.port=8080

logging.structured.format.console=logstash
logging.level.com.vaultor=${LOG_LEVEL:INFO}
app.transfer.max-archive-bytes=${MAX_ARCHIVE_BYTES:536870912}
app.transfer.max-expanded-bytes=${MAX_EXPANDED_BYTES:2147483648}
app.transfer.max-entries=${MAX_ARCHIVE_ENTRIES:20000}
app.export.max-asset-bytes=${MAX_NOTE_EXPORT_ASSET_BYTES:104857600}
