[package]
name = "vaultor-next"
version = "0.1.0"
edition = "2021"
default-run = "vaultor-next"

[lib]
name = "vaultor_next"

[features]
default = ["desktop", "host"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build", "dep:if-addrs", "dep:rcgen", "dep:x509-parser", "dep:zeroize", "dep:mdns-sd", "dep:qrcode"]
host = ["dep:axum", "dep:axum-server", "dep:futures-util", "dep:getrandom", "dep:hex", "dep:hyper-util", "dep:rustls", "dep:subtle", "dep:tempfile", "dep:time", "tokio/fs", "tokio/io-util", "tokio/macros", "tokio/signal", "dep:tokio-util"]

[[bin]]
name = "vaultor-next"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "vaultor-next-host"
path = "src/bin/host.rs"
required-features = ["host"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
if-addrs = { version = "0.15", optional = true }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
tokio = { version = "1", features = ["sync", "rt"] }
pulldown-cmark = { version = "0.13", default-features = false }
sha2 = "0.10"
pdf-writer = "0.15"
encoding_rs = "0.8"
zip = { version = "2.4.2", default-features = false }
percent-encoding = "2"
url = "2"
axum = { version = "0.8", features = ["multipart"], optional = true }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"], optional = true }
futures-util = { version = "0.3", optional = true }
getrandom = { version = "0.4", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
hex = { version = "0.4", optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
subtle = { version = "2", optional = true }
tempfile = { version = "3", optional = true }
time = { version = "0.3", features = ["formatting"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
mdns-sd = { version = "0.22.0", optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[target."cfg(windows)".dependencies]
rcgen = { version = "0.14", features = ["x509-parser", "zeroize"], optional = true }
x509-parser = { version = "0.18", optional = true }
zeroize = { version = "1", optional = true }
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell_Common"] }
notify = { git = "https://github.com/notify-rs/notify.git", rev = "d01dc40", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
