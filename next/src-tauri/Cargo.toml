[package]
name = "vaultor-next"
version = "0.1.0"
edition = "2021"
default-run = "vaultor-next"

[lib]
name = "vaultor_next"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
tokio = { version = "1", features = ["sync"] }
pulldown-cmark = { version = "0.13", default-features = false }
sha2 = "0.10"
percent-encoding = "2"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_Memory", "Win32_UI_Shell"] }
