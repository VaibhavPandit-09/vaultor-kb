name: Vaultor Next Windows exact installer
on:
  push:
    branches: [codex/vaultor-next-m1]
    paths: ['.github/workflows/vaultor-next-windows-candidate.yml', 'next/scripts/qualify-windows.mjs']
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      # A draft asset is visible only with repository push access.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        predecessor: ['fresh', '0.25.2', '0.26.0', '0.27.0']
        refusals: [false]
        include:
          - predecessor: '0.27.0'
            refusals: true
    env:
      CANDIDATE_SHA256: 3420456f90bb7476a8b1a73f546f49bc336bc7f54bd90d25433db34f003acd4c
      CANDIDATE_SOURCE: e37509b0827e3e187a9167999420be1894f35827
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download the pinned draft asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/456309091" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!$release.draft -or $release.target_commitish -ne $env:CANDIDATE_SOURCE) { throw 'Unexpected candidate release or source' }
          $installer = @($release.assets | Where-Object name -EQ 'Vaultor-Next-0.28.0-windows-x64-setup.exe')
          if ($installer.Count -ne 1 -or $installer[0].digest -ne "sha256:$env:CANDIDATE_SHA256") { throw 'Unexpected candidate asset digest' }
          $dir = Join-Path $env:RUNNER_TEMP 'vaultor-exact-candidate'
          New-Item -ItemType Directory -Path $dir | Out-Null
          gh release download v0.28.0 --repo $env:GITHUB_REPOSITORY --pattern $installer[0].name --output (Join-Path $dir 'first.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath (Join-Path $dir 'first.exe')).Hash -ne $env:CANDIDATE_SHA256) { throw 'Downloaded candidate bytes differ' }
      - name: Install and exercise the exact candidate
        shell: pwsh
        env:
          VAULTOR_QUALIFY_LEGACY_FAILURES: ${{ matrix.refusals }}
        run: node next/scripts/qualify-windows.mjs "${{ matrix.predecessor }}" "$env:RUNNER_TEMP/vaultor-exact-candidate" "$env:CANDIDATE_SHA256"
