<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><style>
:root{color-scheme:dark;--canvas:#000;--text:#e8e8e8;--raised:#141414;--border:#555;--muted:#b3b3b3;--accent:#8db7ff;--selected:#101824}
:root[data-theme=light]{color-scheme:light;--canvas:#fafafa;--text:#202020;--raised:#f0f0f0;--border:#ccc;--muted:#515151;--accent:#245bb5;--selected:#e8effb}body{margin:0;background:var(--canvas);color:var(--text);font:17px/1.6 system-ui}#editor{padding:22px 22px 72px}.tiptap{outline:none;min-height:60vh;overflow-wrap:anywhere}.tiptap p{margin:0 0 14px}.tiptap h1{font-size:28px}.tiptap h2{font-size:23px}.tiptap h3{font-size:20px}pre{background:var(--raised);padding:12px;overflow:auto;border-radius:8px}code{font-size:14px}blockquote{margin:12px 0;padding-left:14px;border-left:3px solid #858585}table{border-collapse:collapse;max-width:100%;display:block;overflow:auto}td,th{border:1px solid var(--border);padding:8px;min-width:60px}.resource-link{color:var(--accent);background:var(--selected);border:1px solid var(--border);border-radius:6px;padding:2px 6px;box-decoration-break:clone;cursor:pointer}.resource-link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.resource-link:active{background:#23354d}.image-placement{margin:12px 0;box-sizing:border-box}.image-frame{display:block;width:100%;padding:0;border:1px solid var(--border);background:var(--raised);color:var(--muted);border-radius:8px;overflow:hidden;min-height:44px}.image-frame img{display:block;width:100%;height:auto}.image-frame:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.image-frame span{display:block;padding:14px}.image-frame [hidden]{display:none}figcaption{padding-top:6px}figcaption{color:var(--muted);font-size:14px}a{color:var(--accent)}li[data-type=taskItem]{display:flex;gap:8px}ul[data-type=taskList]{padding:0}
</style></head><body><div id="editor"></div><script src="editor.js"></script></body></html>
